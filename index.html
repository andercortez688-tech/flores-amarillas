<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flores amarillas 🌼</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fff8d6, #ffe98a, #fff4b8);
    font-family: Georgia, serif;
}

.contenedor {
    width: 90%;
    max-width: 1000px;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 40px;
    padding: 40px;
}

/* RAMO */
.ramo {
    position: relative;
    width: 430px;
    height: 520px;
}

/* Tallos */
.tallo {
    position: absolute;
    bottom: 35px;
    left: 50%;
    width: 8px;
    height: 360px;
    background: linear-gradient(to right, #39751e, #6da82d);
    border-radius: 10px;
    transform-origin: bottom;
}

.t1 { transform: rotate(-22deg); }
.t2 { transform: rotate(-10deg); }
.t3 { transform: rotate(0deg); }
.t4 { transform: rotate(12deg); }
.t5 { transform: rotate(24deg); }

/* Hojas */
.hoja {
    position: absolute;
    width: 75px;
    height: 35px;
    background: #4d8c20;
    border-radius: 100% 0 100% 0;
}

.h1 { bottom: 160px; left: 85px; transform: rotate(25deg); }
.h2 { bottom: 210px; left: 250px; transform: rotate(150deg); }
.h3 { bottom: 110px; left: 190px; transform: rotate(30deg); }
.h4 { bottom: 275px; left: 115px; transform: rotate(160deg); }

/* Flores */
.flor {
    position: absolute;
    width: 120px;
    height: 120px;
    animation: flotar 3s ease-in-out infinite;
}

.flor1 { top: 45px; left: 155px; }
.flor2 { top: 95px; left: 65px; animation-delay: .5s; }
.flor3 { top: 105px; left: 245px; animation-delay: 1s; }
.flor4 { top: 165px; left: 135px; animation-delay: 1.5s; }
.flor5 { top: 175px; left: 225px; animation-delay: 2s; }

.petalo {
    position: absolute;
    width: 52px;
    height: 75px;
    background: linear-gradient(#ffe95c, #f5c400);
    border-radius: 50% 50% 45% 45%;
    left: 34px;
    top: 22px;
    transform-origin: 26px 38px;
    box-shadow: 0 3px 8px rgba(160,120,0,.2);
}

.p1 { transform: rotate(0deg) translateY(-25px); }
.p2 { transform: rotate(60deg) translateY(-25px); }
.p3 { transform: rotate(120deg) translateY(-25px); }
.p4 { transform: rotate(180deg) translateY(-25px); }
.p5 { transform: rotate(240deg) translateY(-25px); }
.p6 { transform: rotate(300deg) translateY(-25px); }

.centro {
    position: absolute;
    width: 48px;
    height: 48px;
    background: radial-gradient(circle, #8c5600, #4e3000);
    border-radius: 50%;
    left: 36px;
    top: 36px;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

/* Mensaje */
.mensaje {
    max-width: 430px;
    text-align: center;
    color: #5a4100;
    animation: aparecer 2s ease;
}

.mensaje h1 {
    font-size: 38px;
    margin-bottom: 25px;
    color: #c18b00;
}

.mensaje p {
    font-size: 25px;
    line-height: 1.6;
}

.destacado {
    margin-top: 25px;
    font-size: 29px !important;
    font-weight: bold;
    color: #a86e00;
}

/* Pétalos cayendo */
.petalo-caida {
    position: fixed;
    top: -40px;
    width: 18px;
    height: 25px;
    background: #ffd92f;
    border-radius: 50% 0 50% 50%;
    opacity: .8;
    animation: caer linear infinite;
}

@keyframes caer {
    0% {
        transform: translateY(-50px) rotate(0deg);
    }
    100% {
        transform: translateY(110vh) rotate(720deg);
    }
}

@keyframes flotar {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateX(40px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* Adaptación para teléfono */
@media (max-width: 750px) {
    body {
        overflow-y: auto;
    }

    .contenedor {
        flex-direction: column;
        padding: 30px 10px;
    }

    .ramo {
        transform: scale(.75);
        margin-bottom: -70px;
    }

    .mensaje h1 {
        font-size: 30px;
    }

    .mensaje p {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="contenedor">

    <div class="ramo">

        <div class="tallo t1"></div>
        <div class="tallo t2"></div>
        <div class="tallo t3"></div>
        <div class="tallo t4"></div>
        <div class="tallo t5"></div>

        <div class="hoja h1"></div>
        <div class="hoja h2"></div>
        <div class="hoja h3"></div>
        <div class="hoja h4"></div>

        <div class="flor flor1">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor2">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor3">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor4">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

        <div class="flor flor5">
            <div class="petalo p1"></div>
            <div class="petalo p2"></div>
            <div class="petalo p3"></div>
            <div class="petalo p4"></div>
            <div class="petalo p5"></div>
            <div class="petalo p6"></div>
            <div class="centro"></div>
        </div>

    </div>

    <div class="mensaje">
        <h1>🌼 Para ti 🌼</h1>

        <p>
            Hay detalles que no necesitan
            una fecha especial...
        </p>

        <p class="destacado">
            Ya que él no te dio flores,<br>
            te las doy yo. 💛
        </p>

        <p>
            Espero que estas flores
            te saquen una sonrisa. ✨
        </p>
    </div>

</div>

<!-- Pétalos -->
<div class="petalo-caida" style="left:5%; animation-duration:7s;"></div>
<div class="petalo-caida" style="left:15%; animation-duration:9s; animation-delay:2s;"></div>
<div class="petalo-caida" style="left:28%; animation-duration:6s; animation-delay:1s;"></div>
<div class="petalo-caida" style="left:42%; animation-duration:10s; animation-delay:3s;"></div>
<div class="petalo-caida" style="left:57%; animation-duration:8s;"></div>
<div class="petalo-caida" style="left:70%; animation-duration:11s; animation-delay:2s;"></div>
<div class="petalo-caida" style="left:83%; animation-duration:7s; animation-delay:4s;"></div>
<div class="petalo-caida" style="left:94%; animation-duration:9s; animation-delay:1s;"></div>

</body>
</html>
